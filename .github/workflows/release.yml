name: release

# HUI release pipeline: builds static binaries for linux/x86_64, linux/arm64,
# windows/x86_64, darwin/arm64, and darwin/x86_64 (all cross-compiled from the
# Linux runner — every term_*.go is stdlib-only, no cgo), then publishes a
# GitHub Release under the pushed v* tag.
#
# The `apk` job (needs: release) builds the signed hui-phone Android APK+AAB
# and uploads them to the same release, so one v* tag = one release.
#
# Trigger: push a version tag:  git tag v0.1.0 && git push origin v0.1.0
# Manual test: Actions -> release -> Run workflow (uses branch HEAD as the tag).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_name:
        description: 'VERSION_NAME for manual runs (default: workflow ref name)'
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: hui-cli
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install Go
        run: |
          mkdir -p "$HOME/.local/opt"
          curl -fsSL https://dl.google.com/go/go1.27.3.linux-amd64.tar.gz \
            | tar xz -C "$HOME/.local/opt"
          echo "$HOME/.local/opt/go/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: go version

      - name: Build release targets
        run: |
          build() {
            local goos=$1 goarch=$2 name=$3
            local ts=$(date -u +%Y%m%d%H%M%S)
            echo "building $name ($goos/$goarch, stamp $ts)"
            GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.buildStamp=$ts" -o "dist/$name" ./cmd/hui
          }
          mkdir -p dist
          build linux amd64 hui-linux-x86_64
          build linux arm64 hui-linux-arm64
          build windows amd64 hui-windows-x86_64.exe
          build darwin arm64 hui-mac-arm64
          build darwin amd64 hui-mac-x86_64
          file dist/*
          ls -l dist

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref }}
        run: |
          NAME="${TAG#refs/tags/}"
          gh release create "$NAME" \
            --title "HUI $NAME" \
            --generate-notes \
            "dist/hui-linux-x86_64#hui-linux-x86_64" \
            "dist/hui-linux-arm64#hui-linux-arm64" \
            "dist/hui-windows-x86_64.exe#hui-windows-x86_64.exe" \
            "dist/hui-mac-arm64#hui-mac-arm64" \
            "dist/hui-mac-x86_64#hui-mac-x86_64"

      - name: Note manual run
        if: github.ref_type != 'tag'
        run: echo "Manual run - binaries built but not published (no tag pushed)."

  apk:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        working-directory: hui-phone/companion-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME=/usr/local/lib/android/sdk
            echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          fi
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing. See GITHUB_RELEASE_PIPELINE_PLAN.md Phase 3."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          ls -lh "$RUNNER_TEMP/release.keystore"

      - name: Build signed APK and AAB
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME_INPUT: ${{ inputs.version_name }}
        run: |
          if [ -n "$VERSION_NAME_INPUT" ]; then
            export VERSION_NAME="$VERSION_NAME_INPUT"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            export VERSION_NAME="$GITHUB_REF_NAME"
          else
            export VERSION_NAME="0.0.0-manual-$(git rev-parse --short HEAD)"
          fi
          export VERSION_CODE="$(date +%s)"
          echo "VERSION_NAME=$VERSION_NAME VERSION_CODE=$VERSION_CODE"
          ./gradlew assembleRelease bundleRelease --console=plain

      - name: Verify outputs
        run: |
          ls -lh app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Package server bundle
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import pathlib, zipfile
          src = pathlib.Path("hui-phone/server")
          include = sorted(
              [p for p in src.glob("*.py")] +
              [src / n for n in ("install.sh", "requirements.txt", "AI_SETUP.md") if (src / n).exists()]
          )
          out = pathlib.Path("hui-phone-server.zip")
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for p in include:
                  z.write(p, f"hui-phone-server/{p.name}")
          print(f"bundled {len(include)} files -> {out} ({out.stat().st_size} bytes)")
          for p in include: print(" ", p)
          PY
          ls -lh hui-phone-server.zip

      - name: Publish Android assets
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref }}
        run: |
          NAME="${TAG#refs/tags/}"
          cp app/build/outputs/apk/release/app-release.apk "hui-phone-${NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "hui-phone-${NAME}.aab"
          cp "$GITHUB_WORKSPACE/hui-phone-server.zip" "hui-phone-server-${NAME}.zip"
          sha256sum "hui-phone-${NAME}.apk" "hui-phone-${NAME}.aab" "hui-phone-server-${NAME}.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$NAME" "hui-phone-${NAME}.apk" "hui-phone-${NAME}.aab" "hui-phone-server-${NAME}.zip" SHA256SUMS.txt --clobber
          echo "Uploaded hui-phone-${NAME}.apk/.aab + server bundle to release $NAME"

      - name: Note manual run
        if: github.ref_type != 'tag'
        run: echo "Manual run - APK/AAB built and verified but not uploaded (no tag pushed)."
