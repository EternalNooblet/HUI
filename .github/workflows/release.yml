name: release

# HUI release pipeline: builds static binaries for linux/x86_64, linux/arm64,
# and windows/x86_64 (cross-compiled from the Linux runner — stdlib-only code,
# no cgo), then publishes a GitHub Release under the pushed v* tag. macOS
# targets are added after the Windows path is proven green.
#
# Trigger: push a version tag:  git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          git-ref: ${{ github.ref }}

      - name: Install Go
        run: |
          mkdir -p "$HOME/.local/opt"
          curl -fsSL https://dl.google.com/go/go1.27.3.linux-amd64.tar.gz \
            | tar xz -C "$HOME/.local/opt"
          echo "$HOME/.local/opt/go/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: go version

      - name: Build release targets
        run: |
          build() {
            local goos=$1 goarch=$2 name=$3
            local ts=$(date -u +%Y%m%d%H%M%S)
            echo "building $name ($goos/$goarch, stamp $ts)"
            CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.buildStamp=$ts" -o "dist/$name" .
          }
          mkdir -p dist
          build linux amd64 hui-linux-x86_64
          build linux arm64 hui-linux-arm64
          build windows amd64 hui-windows-x86_64.exe
          file dist/*
          ls -l dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref }}
        run: |
          NAME="${TAG#refs/tags/}"
          gh release create "$NAME" \
            --title "HUI $NAME" \
            --generate-notes \
            "dist/hui-linux-x86_64#hui-linux-x86_64" \
            "dist/hui-linux-arm64#hui-linux-arm64" \
            "dist/hui-windows-x86_64.exe#hui-windows-x86_64.exe"
